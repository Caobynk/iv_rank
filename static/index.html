<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品期权研究面板</title>
<style>
:root {
  --top-h: 56px;
  --nav-w: 232px;
  --bg: #f4f6fa;
  --card: #ffffff;
  --border: #e4e8f0;
  --text: #1f2733;
  --text-2: #5b6573;
  --accent: #2563eb;
  --accent-soft: #eaf1ff;
  --nav-bg: #18233a;
  --nav-text: #aeb9cc;
  --nav-active: #2563eb;
  --red: #d3383a;
  --green: #0f8a5f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); overflow: hidden;
}
/* ===== 顶栏 ===== */
.topbar {
  height: var(--top-h); display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; background: linear-gradient(90deg, #14203a, #1c2c4f); color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.15); position: relative; z-index: 10;
}
.topbar .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; letter-spacing: .5px; }
.topbar .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#3b82f6,#8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.topbar .right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #c7d2e5; }
.topbar .right .upd { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; }
/* ===== 布局 ===== */
.layout { display: flex; height: calc(100% - var(--top-h)); }
/* ===== 左侧导航 ===== */
.nav {
  width: var(--nav-w); min-width: var(--nav-w); background: var(--nav-bg); color: var(--nav-text);
  padding: 12px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
}
.nav .nav-group { font-size: 11px; color: #5f6f8c; padding: 10px 12px 4px; letter-spacing: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
  cursor: pointer; font-size: 14px; transition: all .15s; user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #e6ecf7; }
.nav-item.active { background: var(--nav-active); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.4); }
.nav-item .ico { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.nav-item .ico svg { width: 18px; height: 18px; display: block; }
.nav-item .arrow { margin-left: auto; font-size: 11px; transition: transform .2s; }
.nav-item.open .arrow { transform: rotate(90deg); }
.nav-sub { display: none; padding: 2px 0 4px; }
.nav-item.open + .nav-sub { display: block; }
.sub-item { padding: 8px 12px 8px 44px; font-size: 13px; border-radius: 6px; cursor: pointer; color: #8fa0bd; }
.sub-item:hover { color: #dbe5f5; background: rgba(255,255,255,.05); }
.sub-item.active { color: #fff; background: rgba(37,99,235,.35); }
/* ===== 内容区 ===== */
.content { flex: 1; overflow-y: auto; padding: 20px; }
.panel { display: none; animation: fadeIn .25s ease; }
.panel.show { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
/* iframe 容器 */
.iframe-wrap { height: calc(100vh - var(--top-h) - 40px); background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.iframe-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
/* 静态部署横幅 */
.static-note {
  display: flex; align-items: center; gap: 8px; font-size: 12px; color: #93a4c4;
  background: rgba(255,255,255,.06); padding: 4px 12px; border-radius: 20px;
}
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="brand"><span class="logo">📊</span> 商品期权研究面板</div>
  <div class="right">
    <div class="static-note" id="staticNote">静态版 · 数据更新于 --</div>
    <div class="upd"><span class="dot"></span><span id="updTime">--</span></div>
  </div>
</div>

<div class="layout">
  <!-- 左侧导航 -->
  <div class="nav" id="nav">
    <div class="nav-group">商品期权</div>
    <div class="nav-item active" data-panel="overview"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> 期权市场总览</div>
    <div class="nav-item" data-panel="oi_dist"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l4.5-5.5 4 3L19 6"/><path d="M15 6h4v4"/><path d="M3 21h18"/></svg></span> 期权行情信息</div>
    <div class="nav-item" data-panel="volAnalysis" id="navVolAnalysis"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 17V9"/><path d="M10 17V5"/><path d="M14 17v-7"/><path d="M18 17V8"/></svg></span> 波动率分析 <span class="arrow">▶</span></div>
    <div class="nav-sub" id="navSubVol">
      <div class="sub-item" data-panel="iv_rank">隐含波动率分析</div>
      <div class="sub-item" data-panel="vol_hist">历史波动率估计</div>
      <div class="sub-item" data-panel="vol_corr">标的-波动率相关性</div>
    </div>
    <div class="nav-item" data-panel="pcr"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6"/><path d="M12 20V8"/><path d="M19 20v-9"/><path d="M3 20h18"/></svg></span> 商品期权PCR跟踪</div>
    <div class="nav-item" data-panel="gex"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/><path d="M12 1.5v4"/><path d="M12 18.5v4"/><path d="M1.5 12h4"/><path d="M18.5 12h4"/></svg></span> 商品期权GEX分析</div>
    <div class="nav-item" data-panel="fundamentals"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4z"/><path d="M5 4a2 2 0 0 1 2-2h9v4"/><path d="M9 11h6"/><path d="M9 15h4"/></svg></span> 商品基本面跟踪</div>
  </div>

  <!-- 内容区 -->
  <div class="content">

    <!-- 期权市场总览 -->
    <div class="panel show" id="panel-overview"><div class="iframe-wrap"><iframe src="sub/overview/index.html"></iframe></div></div>

    <!-- 期权行情信息 -->
    <div class="panel" id="panel-oi_dist"><div class="iframe-wrap"><iframe src="sub/oi_dist/index.html"></iframe></div></div>

    <!-- 波动率分析：历史波动率估计 -->
    <div class="panel" id="panel-vol_hist"><div class="iframe-wrap"><iframe src="sub/vol_hist/index.html"></iframe></div></div>

    <!-- 波动率分析：隐含波动率分位图（IV_Rank 子服务） -->
    <div class="panel" id="panel-iv_rank"><div class="iframe-wrap"><iframe src="sub/iv_rank/index.html"></iframe></div></div>

    <!-- 波动率分析：标的-波动率相关性（纯静态页） -->
    <div class="panel" id="panel-vol_corr"><div class="iframe-wrap"><iframe src="corr/index.html"></iframe></div></div>

    <!-- 商品期权PCR跟踪 -->
    <div class="panel" id="panel-pcr"><div class="iframe-wrap"><iframe src="sub/pcr/index.html"></iframe></div></div>

    <!-- 商品期权GEX分析 -->
    <div class="panel" id="panel-gex"><div class="iframe-wrap"><iframe src="sub/gex/index.html"></iframe></div></div>

    <!-- 商品基本面跟踪（庞博知识库最近一周报告整理） -->
    <div class="panel" id="panel-fundamentals"><div class="iframe-wrap"><iframe src="fundamentals/index.html"></iframe></div></div>

  </div>
</div>

<script>
// ====== 静态版：无后端依赖，iframe 已直指相对路径 ======
function switchPanel(panel) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
  const el = document.getElementById('panel-' + panel);
  if (el) el.classList.add('show');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.panel === panel));
  document.querySelectorAll('.sub-item').forEach(n => n.classList.toggle('active', n.dataset.panel === panel));
  // 切换到 iframe 面板时通知 ECharts resize（避免隐藏初始化拿到 0 宽）
  notifyResize(panel);
  setTimeout(() => notifyResize(panel), 200);
}

function notifyResize(panel) {
  document.querySelectorAll(`#panel-${panel} iframe`).forEach(iframe => {
    try { iframe.contentWindow.postMessage({ type: 'echarts-resize' }, '*'); } catch (e) {}
  });
}

// 一级导航点击
document.querySelectorAll('.nav-item[data-panel]').forEach(item => {
  item.addEventListener('click', () => {
    const panel = item.dataset.panel;
    if (panel === 'volAnalysis') {
      const open = item.classList.contains('open');
      item.classList.toggle('open', !open);
      if (!open) {
        switchPanel('iv_rank');
      } else {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.sub-item').forEach(n => n.classList.remove('active'));
      }
    } else {
      switchPanel(panel);
    }
  });
});

// 二级导航（波动率分析子项）
document.querySelectorAll('.sub-item').forEach(item => {
  item.addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('navVolAnalysis').classList.add('open');
    switchPanel(item.dataset.panel);
  });
});

// 读取构建信息（site_info.json），显示数据更新时间
async function loadSiteInfo() {
  try {
    const r = await fetch('site_info.json', { cache: 'no-store' });
    const d = await r.json();
    const dt = d.build_time ? d.build_time.slice(0, 16) : '--';
    document.getElementById('staticNote').textContent = `静态版 · 构建于 ${dt}`;
    document.getElementById('updTime').textContent = `数据截至 ${d.latest_trade_date || '--'}`;
  } catch (e) {
    document.getElementById('updTime').textContent = '静态版';
  }
}

// 启动
loadSiteInfo();
switchPanel('overview');
</script>
</body>
</html>
