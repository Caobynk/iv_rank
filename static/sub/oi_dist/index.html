<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品期权成交持仓分布及最痛点位</title>
<script src="./echarts.min.js"></script>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1f2733;
    --muted: #7a869a;
    --line: #e7ebf3;
    --call: #e6553e;   /* 看涨 红 */
    --put:  #2f9e6f;   /* 看跌 绿 */
    --accent: #3b6cf6;
    --shadow: 0 6px 22px rgba(31, 39, 51, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: linear-gradient(120deg, #2b3a67 0%, #3b6cf6 100%);
    color: #fff;
    padding: 20px 28px;
    box-shadow: var(--shadow);
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  header p { margin: 6px 0 0; font-size: 13px; opacity: .82; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 24px 60px; }

  .controls {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;
    background: var(--card); border-radius: 14px; padding: 18px 20px;
    box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); }
  select, input[type=date] {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px;
    font-size: 14px; background: #fff; color: var(--ink); min-width: 200px;
  }
  .btns { display: flex; gap: 10px; margin-left: auto; }
  button {
    border: none; border-radius: 9px; padding: 10px 20px; font-size: 14px;
    cursor: pointer; font-weight: 600; transition: .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.07); }
  .btn-ghost { background: #eef1f8; color: var(--ink); }
  .btn-ghost:hover { background: #e2e7f3; }

  .banner { font-size: 13px; padding: 10px 14px; border-radius: 9px; margin-bottom: 16px; display: none; }
  .banner.err { background: #fdecec; color: #c0392b; border: 1px solid #f5c6c6; }
  .banner.loading { background: #eef4ff; color: #2b5fd9; border: 1px solid #cfe0ff; }

  .summary { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 19px; font-weight: 700; margin-top: 4px; }

  .months { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    padding: 7px 14px; border-radius: 20px; background: #fff; border: 1px solid var(--line);
    font-size: 13px; cursor: pointer; color: var(--ink); transition: .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .mp-callout {
    display: flex; align-items: center; gap: 14px; background: var(--card);
    border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .mp-callout .tag { font-size: 13px; color: var(--muted); }
  .mp-callout .num { font-size: 26px; font-weight: 800; color: var(--accent); }
  .mp-callout .sub { font-size: 12px; color: var(--muted); }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .panel { background: var(--card); border-radius: 14px; padding: 16px 16px 6px; box-shadow: var(--shadow); }
  .panel h3 { margin: 0 0 4px; font-size: 15px; }
  .panel .hint { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .chart { width: 100%; height: 380px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-weight: 600; background: #fafbfe; }
  tbody tr.sel { background: #eef4ff; }
  .legend-inline { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 12px; vertical-align: middle; }
  .section-title { font-size: 15px; font-weight: 600; margin: 22px 0 10px; }
  @media (max-width: 900px) {
    .summary { grid-template-columns: repeat(3, 1fr); }
    .charts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>商品期权 · 成交持仓分布与最痛点位</h1>
  <p>选择品种与交易日，查看各到期月份期权合约的成交量 / 持仓量分布及最痛点（Max Pain）</p>
</header>

<div class="wrap">
  <div class="controls">
    <div class="field">
      <label>品种</label>
      <select id="variety"></select>
    </div>
    <div class="field">
      <label>交易日</label>
      <input type="date" id="date" value="2026-08-26" disabled>
    </div>
    <div class="btns">
      <button class="btn-primary" id="btn-query">查询</button>
      <button class="btn-ghost" id="btn-stop">停止服务</button>
    </div>
  </div>

  <div class="banner" id="banner"></div>

  <div id="content" style="display:none">
    <div class="summary" id="summary"></div>
    <div class="months" id="months"></div>
    <div class="mp-callout" id="mp-callout"></div>

    <div class="charts">
      <div class="panel">
        <h3>成交量分布（按行权价）</h3>
        <div class="hint">横轴为行权价格，柱状图分看涨 / 看跌；竖线标注最痛点位。</div>
        <div class="chart" id="chart-volume"></div>
      </div>
      <div class="panel">
        <h3>持仓量分布（按行权价）</h3>
        <div class="hint">基于持仓量计算最痛点（期权卖方理论最大赔付最小处）。</div>
        <div class="chart" id="chart-oi"></div>
      </div>
    </div>

    <div class="section-title">各月份最痛点概览</div>
    <div class="panel" style="padding:14px 16px;">
      <div class="legend-inline">
        <span class="dot" style="background:var(--call)"></span>看涨
        <span class="dot" style="background:var(--put)"></span>看跌
      </div>
      <table id="overview">
        <thead>
          <tr>
            <th>到期月份</th><th>最痛点</th>
            <th>看涨持仓</th><th>看跌持仓</th>
            <th>看涨成交</th><th>看跌成交</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const CALL = '#e6553e', PUT = '#2f9e6f', ACCENT = '#3b6cf6';
let current = null;       // 当前查询结果
let selectedMonth = null; // 当前选中月份
let volChart, oiChart;
const fmt = n => (n == null ? '-' : Number(n).toLocaleString('zh-CN'));

// ---------- 初始化 ----------
async function init() {
  document.getElementById('date').value = "2026-08-26";
  try {
    const res = await fetch('varieties.json');
    const data = await res.json();
    fillVarieties(data.groups);
  } catch (e) {
    showBanner('加载品种列表失败：' + e, 'err');
  }
  document.getElementById('btn-query').onclick = query;
  volChart = echarts.init(document.getElementById('chart-volume'));
  oiChart = echarts.init(document.getElementById('chart-oi'));
  window.addEventListener('resize', () => { volChart.resize(); oiChart.resize(); });
  query(); // 默认查询
}

function fillVarieties(groups) {
  const sel = document.getElementById('variety');
  let firstCode = null;
  groups.forEach(g => {
    const og = document.createElement('optgroup');
    og.label = g.exchange_name;
    g.varieties.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.code; opt.textContent = `${v.name} (${v.code})`;
      og.appendChild(opt);
      if (!firstCode) firstCode = v.code;
    });
    sel.appendChild(og);
  });
  if (firstCode) sel.value = (sel.querySelector('option[value="m"]') ? 'm' : firstCode);
}

function showBanner(msg, type) {
  const b = document.getElementById('banner');
  b.textContent = msg; b.className = 'banner ' + (type || '');
  b.style.display = msg ? 'block' : 'none';
}

// ---------- 查询 ----------
async function query() {
  const variety = document.getElementById('variety').value;
  const date = document.getElementById('date').value;
  if (!variety || !date) { showBanner('请选择品种与交易日', 'err'); return; }
  showBanner('加载静态数据…', 'loading');
  try {
    const res = await fetch(`data/${encodeURIComponent(variety)}.json`);
    const data = await res.json();
    if (!data.success) { showBanner('查询失败：' + data.error, 'err'); return; }
    current = data;
    selectedMonth = data.months.length ? data.months[0].month : null;
    render();
    showBanner('', '');
  } catch (e) {
    showBanner('请求异常：' + e, 'err');
  }
}

function render() {
  if (!current) return;
  document.getElementById('content').style.display = 'block';
  renderSummary();
  renderMonths();
  renderCallout();
  renderCharts();
  renderOverview();
}

function renderSummary() {
  const c = current;
  const cards = [
    ['品种', `${c.variety_name} (${c.variety_code})`],
    ['交易所', c.exchange_name],
    ['交易日', c.trade_date],
    ['到期月份数', c.month_count],
    ['总成交量', fmt(c.total_volume)],
    ['总持仓量', fmt(c.total_oi)],
  ];
  document.getElementById('summary').innerHTML = cards.map(
    ([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`
  ).join('');
}

function renderMonths() {
  const box = document.getElementById('months');
  if (!current.months.length) { box.innerHTML = '<span style="color:var(--muted);font-size:13px">该交易日无期权合约数据</span>'; return; }
  box.innerHTML = '';
  current.months.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (m.month === selectedMonth ? ' active' : '');
    chip.textContent = m.month;
    chip.onclick = () => { selectedMonth = m.month; renderMonths(); renderCallout(); renderCharts(); };
    box.appendChild(chip);
  });
}

function getMonth() {
  return current.months.find(m => m.month === selectedMonth) || null;
}

function renderCallout() {
  const m = getMonth();
  const el = document.getElementById('mp-callout');
  if (!m) { el.innerHTML = ''; return; }
  const mp = m.max_pain == null ? '—' : fmt(m.max_pain);
  el.innerHTML = `
    <div>
      <div class="tag">${m.month} 月份合约 · 最痛点位（Max Pain）</div>
      <div class="num">${mp}</div>
    </div>
    <div class="sub">该行权价下，看涨+看跌期权卖方整体理论赔付最小。<br>
      看涨持仓 ${fmt(m.total_call_oi)} · 看跌持仓 ${fmt(m.total_put_oi)}</div>`;
}

function baseOption(title, m, valueKey) {
  const strikes = m.strikes.map(String);
  const callData = m['call_' + valueKey];
  const putData = m['put_' + valueKey];
  const markLine = (m.max_pain != null) ? {
    symbol: 'none',
    lineStyle: { color: ACCENT, type: 'dashed', width: 2 },
    label: { formatter: '最痛点 ' + fmt(m.max_pain), color: ACCENT, position: 'insideEndTop' },
    data: [{ xAxis: String(m.max_pain) }]
  } : undefined;
  return {
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      formatter: params => {
        const s = params[0].axisValue;
        let html = `行权价 <b>${s}</b><br>`;
        params.forEach(p => { html += `${p.marker}${p.seriesName}: ${fmt(p.value)}<br>`; });
        return html;
      }
    },
    legend: { data: ['看涨', '看跌'], top: 0, right: 0 },
    grid: { left: 56, right: 18, top: 36, bottom: 56 },
    xAxis: {
      type: 'category', data: strikes, name: '行权价', nameLocation: 'middle', nameGap: 34,
      axisLabel: { rotate: strikes.length > 14 ? 45 : 0, color: '#5b6678', fontSize: 11 }
    },
    yAxis: { type: 'value', name: title, axisLabel: { color: '#5b6678' }, splitLine: { lineStyle: { color: '#eef1f8' } } },
    series: [
      { name: '看涨', type: 'bar', data: callData, itemStyle: { color: CALL, borderRadius: [3,3,0,0] },
        markLine, barMaxWidth: 22 },
      { name: '看跌', type: 'bar', data: putData, itemStyle: { color: PUT, borderRadius: [3,3,0,0] }, barMaxWidth: 22 }
    ]
  };
}

function renderCharts() {
  const m = getMonth();
  if (!m) { volChart.clear(); oiChart.clear(); return; }
  volChart.setOption(baseOption('成交量', m, 'volume'), true);
  oiChart.setOption(baseOption('持仓量', m, 'oi'), true);
}

function renderOverview() {
  const tb = document.querySelector('#overview tbody');
  tb.innerHTML = current.months.map(m => `
    <tr class="${m.month === selectedMonth ? 'sel' : ''}">
      <td>${m.month}</td>
      <td>${m.max_pain == null ? '—' : fmt(m.max_pain)}</td>
      <td>${fmt(m.total_call_oi)}</td>
      <td>${fmt(m.total_put_oi)}</td>
      <td>${fmt(m.total_call_volume)}</td>
      <td>${fmt(m.total_put_volume)}</td>
    </tr>`).join('');
}


init();
</script>
</body>
</html>
